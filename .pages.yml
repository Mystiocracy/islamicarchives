# Admin page configuration for Pages CMS (https://pagescms.org).
# Sign in at https://app.pagescms.org with GitHub and open this repository.
media:
  input: public/media
  output: /media

content:
  - name: works
    label: Works
    type: collection
    path: content/works
    filename: "{fields.title}.md"
    view:
      fields: [title, author, year, rights]
      primary: title
      sort: [year, title]
      default:
        sort: year
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: author
        label: Author
        type: reference
        required: true
        options:
          collection: authors
          search: name
          value: "{path}"
          label: "{name}"
        description: "Pick the author. If they are not listed yet, add them under Authors first."
      - { name: coAuthors, label: Co-authors (if any), type: string }
      - { name: titleOriginal, label: Title in original script (optional), type: string }
      - { name: year, label: Year first published (leave empty if unknown), type: number }
      - name: language
        label: Language
        type: select
        default: English
        options: { creatable: true, values: [English, Arabic, Urdu, Persian, Bengali, Hindi, French, Turkish, Malay, Bosnian, Malayalam, Other] }
      - name: type
        label: Type
        type: select
        default: Article
        options: { values: [Book, Pamphlet, Article, Chapter, Essay, Policy paper, Speech, Review, Collection, Anthology, Translation, Novel, Memoir, Letters, Bibliography, Interview] }
      - name: subjects
        label: Subjects
        type: reference
        options:
          collection: subjects
          multiple: true
          search: name
          label: "{name}"
        description: "Pick one or more. To add a new subject, create it under Subjects first."
      - name: keywords
        label: Keywords
        type: string
        list: true
        description: "Any extra words people might search for: names, places, concepts (e.g. ijtihād, Aligarh, caliphate)."
      - { name: venue, label: Where it was published, type: string, description: "Journal, publisher or website" }
      - { name: summary, label: One- or two-sentence summary, type: text }
      - name: rights
        label: Rights status
        type: select
        required: true
        options:
          values:
            - { value: public-domain, label: "Public domain – host the full text" }
            - { value: permission, label: "Permission granted – host the full text" }
            - { value: link-only, label: "In copyright – link to the free copy only" }
      - { name: rightsNote, label: Rights note, type: string, description: "e.g. 'author d. 1938' or 'permission from the estate, 2026'" }
      - { name: sourceUrl, label: Link to free copy (Read at source), type: string }
      - { name: sourceLabel, label: Name of the source website, type: string, description: "Shown as 'Source: …', e.g. Internet Archive" }
      - { name: infoUrl, label: Catalogue or publisher page (when no free copy exists), type: string }
      - { name: sourceEdition, label: Source edition used for the text, type: string }
      - { name: contents, label: Chapter list (optional), type: string, list: true }
      - { name: added, label: Date added to the archive, type: date }
      - { name: draft, label: Hide from the site (draft), type: boolean, default: false }
      - { name: body, label: Full text (leave empty for link-only works), type: rich-text }

  - name: authors
    label: Authors
    type: collection
    path: content/authors
    filename: "{fields.name}.md"
    view:
      fields: [name, born, died]
      primary: name
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: nameNative, label: Name in original script, type: string }
      - name: nativeLang
        label: Original script language
        type: select
        options: { values: [ar, ur, fa] }
      - { name: born, label: Year born, type: number }
      - { name: died, label: Year died (leave empty if living), type: number }
      - { name: region, label: Region, type: string }
      - { name: roles, label: Roles, type: string, description: "e.g. Poet, philosopher, lawyer" }
      - { name: featured, label: Feature on the home page, type: boolean, default: false }
      - { name: sortAs, label: Sort as (A–Z list), type: string, description: "Name to file the author under, e.g. Taha. Leave empty to use the last word of the name" }
      - { name: sources, label: Biography sources (links), type: string, list: true }
      - { name: body, label: Short biography, type: rich-text }

  - name: subjects
    label: Subjects
    type: collection
    path: content/subjects
    filename: "{fields.name}.md"
    view:
      fields: [name, order, featured]
      primary: name
      sort: [order, name]
    fields:
      - { name: name, label: Subject name, type: string, required: true }
      - { name: order, label: Position in lists (1 = first), type: number, default: 100 }
      - { name: featured, label: Show on the home page, type: boolean, default: true }
      - { name: body, label: Short description, type: rich-text }

  - name: eras
    label: Eras
    type: collection
    path: content/eras
    filename: "{fields.from}-{fields.name}.md"
    view:
      fields: [name, from, to]
      primary: name
      sort: [from]
    fields:
      - { name: name, label: Era name, type: string, required: true }
      - { name: from, label: First year, type: number, required: true }
      - { name: to, label: Last year (use 9999 for “today”), type: number, required: true }
      - { name: body, label: Short description, type: rich-text }
