name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_FTP: ${{ secrets.FTP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pandoc and WeasyPrint (for EPUB, Word and PDF downloads)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint fonts-dejavu fonts-noto-core

      - run: npm ci

      - name: Build site, search index and downloads
        run: npm run build

      - name: Add the email library and mail settings for Send to Kindle
        if: ${{ env.HAS_FTP == 'true' }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          cd dist/api
          composer require --no-interaction --quiet phpmailer/phpmailer:^6.9
          node -e '
            const fs = require("fs");
            const q = (s) => JSON.stringify(s || "");
            fs.writeFileSync("config.php", `<?php\nreturn [\n  "smtp_host" => "smtp.hostinger.com",\n  "smtp_port" => 465,\n  "smtp_user" => ${q(process.env.SMTP_USER)},\n  "smtp_password" => ${q(process.env.SMTP_PASSWORD)},\n  "from_name" => "Islamic Archives",\n];\n`);
          '

      - name: Upload to Hostinger
        if: ${{ env.HAS_FTP == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
