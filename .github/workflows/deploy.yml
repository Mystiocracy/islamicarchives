name: Build and deploy

# NO LONGER USED. The site is built and published from the owner's PC with `npm run deploy`
# (see DEPLOY.md); GitHub is only the backup of the code. This workflow is kept as a manual
# fallback: it builds without the Sanadset text files, and publishing its `deploy` branch
# would clear them from the server.

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pandoc and WeasyPrint (for EPUB, Word and PDF downloads)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint fonts-dejavu fonts-noto-core

      - run: npm ci

      - name: Build site, search index and downloads
        run: npm run build

      - name: Add the email library used by Send to Kindle
        run: |
          cd dist/api
          composer require --no-interaction --quiet phpmailer/phpmailer:^6.9

      - name: Publish the built site to the deploy branch
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
